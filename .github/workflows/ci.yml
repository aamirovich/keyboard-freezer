name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:   # no Python 3.9 builds for these runner images; 3.9 is covered on Windows
          - os: macos-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: macos-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python keyboard_freezer.py --help

  windows-hook:
    name: Windows - keys blocked for real
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tests/smoke_windows.py

  linux-x11:
    name: Linux X11 - keys blocked for real (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool
      - run: xvfb-run -a python tests/smoke_x11.py

  linux-evdev:
    name: Linux evdev - keys blocked for real (virtual keyboard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: sudo modprobe uinput || true
      - run: sudo "$(which python)" tests/smoke_evdev.py

  macos-tap:
    name: macOS - keys blocked for real (or permission message)
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tests/smoke_macos.py
